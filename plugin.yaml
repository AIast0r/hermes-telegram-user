name: telegram-user
label: Telegram User (MTProto)
kind: platform
version: 0.6.0
description: Self-contained MTProto user-account bridge for Hermes with .h commands, reply/media context, unread/folder digests, global search, cached voice STT, aliases, rate-limit protection, media retrieval, contacts, participants, pinned/draft/scheduled surfaces, profile and session diagnostics, and a resumable local archive with offline search. One explicitly scoped tool marks a summarised chat or forum thread as read. No external MCP required.
author: community
requires_env:
  - name: HERMES_TG_USER_API_ID
    description: Telegram API ID from my.telegram.org
    prompt: Telegram API ID
    password: false
  - name: HERMES_TG_USER_API_HASH
    description: Telegram API hash from my.telegram.org
    prompt: Telegram API hash
    password: true
  - name: HERMES_TG_USER_SESSION
    description: Telethon StringSession for the user account
    prompt: Telethon StringSession
    password: true
optional_env:
  - name: HERMES_TG_USER_COMMAND
    description: Command prefix; defaults to .h
    prompt: Command prefix
    password: false
  - name: HERMES_TG_USER_REPLY_DEPTH
    description: Reply-chain depth automatically injected for .h replies; 1-5, default 3
    prompt: Reply context depth
    password: false
  - name: HERMES_TG_USER_MAX_MEDIA_MB
    description: Maximum Telegram attachment size cached/downloaded by the plugin; default 50 MB
    prompt: Maximum media MB
    password: false
  - name: HERMES_TG_USER_FLOOD_SLEEP_THRESHOLD
    description: FloodWait seconds Telethon may sleep internally; default 30, 0 disables silent FloodWait sleep
    prompt: FloodWait sleep threshold
    password: false
  - name: HERMES_TG_USER_MAX_CONCURRENT_TOOLS
    description: Maximum concurrent Telegram tool clients in this Hermes process; default 3
    prompt: Telegram tool concurrency
    password: false
  - name: HERMES_TG_USER_TOOL_MIN_INTERVAL_MS
    description: Minimum spacing between Telegram tool-call starts; default 150 ms
    prompt: Telegram tool spacing ms
    password: false
  - name: HERMES_TG_USER_STATE_DIR
    description: Directory for private alias/transcript state; defaults to ~/.hermes/state/telegram-user
    prompt: Telegram plugin state directory
    password: false
provides_tools:
  - tg_find_chat
  - tg_list_topics
  - tg_read_messages
  - tg_get_message_context
  - tg_search_messages
  - tg_search_global
  - tg_list_folders
  - tg_get_unread
  - tg_read_folder
  - tg_search_media
  - tg_download_media
  - tg_transcribe_voice
  - tg_contacts
  - tg_participants
  - tg_set_alias
  - tg_list_aliases
  - tg_delete_alias
  - tg_get_pinned
  - tg_get_drafts
  - tg_get_scheduled
  - tg_get_profile
  - tg_get_sessions
  - tg_archive_sync
  - tg_archive_search
  - tg_archive_status
  - tg_archive_forget
  - tg_list_digest_marks
  - tg_forget_digest_marks
  - tg_mark_summarized
